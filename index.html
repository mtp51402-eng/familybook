<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<title>Family Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7B66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Serif+Malayalam:wght@500;600&display=swap">
<style>
/* Family Book – modern layout: gradient hero header, floating pill tab bar, avatar cards, soft elevation. */
:root {
  --bg: #F5F3EE;
  --bg2: #ECE9E1;
  --surface: #FFFFFF;
  --ink: #17202A;
  --muted: #667085;
  --line: #E7E3D8;
  --accent: #0F7B66;
  --accent2: #14A383;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDF3EB;
  --gold: #E5A93D;
  --warn: #8A5A00;
  --warn-soft: #FFF1D0;
  --danger: #C4321F;
  --shadow: 0 1px 2px rgba(23,32,42,.05), 0 8px 24px -12px rgba(23,32,42,.18);
  --shadow-lg: 0 12px 32px -8px rgba(15,123,102,.45);
  --r: 20px;
  --font-display: "Fraunces", "Noto Serif Malayalam", "Noto Sans Malayalam", Georgia, serif;
  --font-body: "Plus Jakarta Sans", "Noto Sans Malayalam", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1113;
    --bg2: #111A1D;
    --surface: #131C1F;
    --ink: #EAF1EE;
    --muted: #93A3A0;
    --line: #22302F;
    --accent: #38C9A2;
    --accent2: #1FA383;
    --accent-ink: #04211A;
    --accent-soft: #14352D;
    --gold: #F0BE5C;
    --warn: #FFD98A;
    --warn-soft: #3A2F0F;
    --danger: #FF8A7A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lg: 0 12px 32px -8px rgba(56,201,162,.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease; }
button:active { transform: scale(.97); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
[hidden] { display: none !important; }
.bi { display: inline-flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; }
.bi b { font-weight: 600; }
.bi small { font-size: 0.74em; opacity: 0.65; font-weight: 500; letter-spacing: .02em; }

#app {
  min-height: 100dvh;
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
}
/* hero header */
.bar {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px;
  margin-top: 12px; padding: 18px 18px;
  border-radius: 26px;
  color: #fff;
  background:
    radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.22) 0%, transparent 55%),
    radial-gradient(90% 120% at 0% 100%, rgba(229,169,61,.35) 0%, transparent 60%),
    linear-gradient(135deg, #0B5E4F 0%, #0F7B66 55%, #14A383 100%);
  box-shadow: var(--shadow-lg);
}
.bar::after {
  content: ""; position: absolute; right: -28px; bottom: -34px; width: 150px; height: 150px; border-radius: 50%;
  border: 22px solid rgba(255,255,255,.09);
}
.logo { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(6px); }
.logo svg { width: 26px; height: 26px; }
.bar h1 { margin: 0; font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
.bar .count { margin-top: 2px; font-size: 0.82rem; font-weight: 500; color: rgba(255,255,255,.82); }
#view { flex: 1 1 auto; padding-block: 16px 170px; }
.view { display: flex; flex-direction: column; gap: 16px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view, #toast { animation: none !important; } button { transition: none; } }

/* floating tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
}
.tabs-in {
  pointer-events: auto;
  max-width: 420px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px;
  width: calc(100% - 32px);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 26px;
  box-shadow: 0 14px 34px -10px rgba(23,32,42,.28);
}
.tabs button { border: 0; background: transparent; padding: 8px 4px 7px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); font-size: 0.78rem; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button .bi { flex-direction: column; align-items: center; row-gap: 0; }
.tabs button .bi small { display: none; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tabs button[aria-current="page"] b { font-weight: 700; }
.fab {
  position: fixed; z-index: 6;
  right: max(18px, env(safe-area-inset-right, 0px));
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 30px; min-height: 54px; padding: 0 22px 0 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink);
  color: #fff; font-weight: 600;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 8px;
}
.fab .bi small { display: none; }
.fab svg { flex: 0 0 auto; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 8px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.bday { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px; border-top: 1px dashed var(--line); }
.bday:first-of-type { border-top: 0; }
.bday .link { border: 0; background: transparent; padding: 0; font-weight: 600; color: var(--ink); }
.bday .link::before { content: "🎂 "; }
.bday span:last-child { color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; font-weight: 600; text-align: right; }

.empty { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 28px; }
.empty h2 { margin: 0; font-family: var(--font-display); font-size: 1.4rem; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }

/* tree */
.tree { display: flex; flex-direction: column; gap: 16px; }
.node { display: flex; flex-direction: column; gap: 10px; }
.unit { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.amp { color: var(--gold); font-weight: 700; }
.pcard {
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: "av nm" "av mt" "av bt"; column-gap: 10px; align-items: center; align-content: center; justify-items: start;
  text-align: left; min-width: 0; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px 14px 8px 8px;
  box-shadow: var(--shadow);
}
.pcard .av { grid-area: av; }
.pcard .nm { grid-area: nm; }
.pcard .mt { grid-area: mt; }
.pcard .bt { grid-area: bt; }
.pcard:active { background: var(--accent-soft); }
.pcard .nm { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.pcard .mt { font-size: 0.78rem; color: var(--muted); }
.pcard .bt, .badge { font-size: 0.7rem; font-weight: 700; color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); border-radius: 999px; padding: 0 8px; letter-spacing: .02em; }
.pcard.gone { border-style: dashed; opacity: .85; }
.pcard.gone .av { filter: grayscale(.7); }
.tog { align-self: flex-start; border: 0; background: transparent; color: var(--accent); padding: 4px 2px; font-size: 0.85rem; font-weight: 600; }
.kids { margin-left: 22px; padding-left: 16px; border-left: 2px solid color-mix(in srgb, var(--accent) 30%, var(--line)); display: flex; flex-direction: column; gap: 14px; }
.kids > .node { position: relative; }
.kids > .node::before { content: ""; position: absolute; left: -16px; top: 24px; width: 12px; border-top: 2px solid color-mix(in srgb, var(--accent) 30%, var(--line)); }

/* avatars */
.av {
  --h: 160;
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; line-height: 1;
  background: hsl(var(--h) 60% 88%); color: hsl(var(--h) 55% 24%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .av { background: hsl(var(--h) 35% 22%); color: hsl(var(--h) 70% 82%); } }
.av.lg { width: 56px; height: 56px; border-radius: 20px; font-size: 1.6rem; }

/* people */
.search { width: 100%; height: 50px; padding: 0 18px; border: 1px solid var(--line); border-radius: 25px; background: var(--surface); box-shadow: var(--shadow); }
.search:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.list { display: flex; flex-direction: column; gap: 10px; }
.prow { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px 10px 10px; box-shadow: var(--shadow); }
.prow .main { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.prow .nm { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.prow .rl { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.prow .side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: 0 0 auto; font-size: 0.78rem; color: var(--muted); }
.none { color: var(--muted); text-align: center; padding: 28px 0; }

.more-row { display: flex; flex-direction: column; gap: 10px; }
.more-row p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.help ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 0.9rem; }

/* buttons */
.btn { min-height: 46px; padding: 8px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; box-shadow: 0 1px 2px rgba(23,32,42,.05); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; box-shadow: 0 8px 18px -8px rgba(15,123,102,.7); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: transparent; box-shadow: none; }
.btn.small { min-height: 38px; padding: 4px 14px; font-size: 0.9rem; }
.btn:disabled { opacity: 0.5; }

/* bottom sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(10,18,20,0.55); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card {
  width: 100%; max-width: 680px; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 30px 30px 0 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px;
  animation: slideUp .28s cubic-bezier(.2,.8,.2,1) both;
}
.sheet-card::before { content: ""; align-self: center; width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin-bottom: 2px; flex: 0 0 auto; }
@keyframes slideUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-head .who { display: flex; align-items: center; gap: 14px; min-width: 0; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.4rem; line-height: 1.25; overflow-wrap: anywhere; letter-spacing: -.01em; }
.x { flex: 0 0 auto; width: 40px; height: 40px; border: 0; background: var(--bg2); border-radius: 14px; display: grid; place-items: center; color: var(--muted); }
.life { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.facts { display: flex; flex-direction: column; }
.fact { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); }
.fact:first-child { border-top: 0; }
.fact .k { color: var(--muted); font-size: 0.85rem; flex: 0 0 auto; }
.fact .v { text-align: right; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; align-items: center; font-weight: 500; }
.rel { display: flex; flex-direction: column; gap: 8px; padding-block: 10px; border-top: 1px solid var(--line); }
.rel:first-child { border-top: 0; }
.rel .k { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
.rel .vs { display: flex; flex-wrap: wrap; gap: 8px; }
.link { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 14px; font-size: 0.92rem; color: var(--accent); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.a-link { color: var(--accent); font-weight: 600; text-decoration: none; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lab { font-weight: 600; font-size: 0.86rem; color: var(--muted); }
.field input[type="text"], .field input[type="tel"], .field input[type="number"], .field input[type="date"], .field input[type="password"], .field select, .field textarea {
  width: 100%; min-height: 50px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.field textarea { min-height: 88px; resize: vertical; }
.hint { font-size: 0.8rem; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { flex-direction: row; align-items: center; gap: 10px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }
.chips-sp { display: flex; flex-wrap: wrap; gap: 8px; }
.sp-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); border-radius: 999px; padding: 4px 6px 4px 14px; font-weight: 500; }
.sp-chip button { border: 0; background: transparent; width: 24px; height: 24px; border-radius: 50%; color: var(--ink); font-size: 1rem; line-height: 1; }
.form-err { margin: 0; color: var(--danger); font-size: 0.92rem; }
.form-bar { display: flex; gap: 10px; flex-wrap: wrap; position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-block: 14px 2px; }
.form-bar .btn.primary { flex: 1 1 140px; }

/* PIN lock + login */
.lock, #login {
  position: fixed; inset: 0; background:
    radial-gradient(80% 50% at 50% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
    var(--bg);
}
.lock { z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; }
.lock form { width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 14px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 28px 22px; box-shadow: var(--shadow); }
.lock h2 { margin: 0; font-family: var(--font-display); }
.lock input { text-align: center; letter-spacing: 0.5em; font-size: 1.5rem; min-height: 56px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--ink); }
.lock input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

#login { z-index: 45; overflow-y: auto; display: flex; justify-content: center; padding: 24px 16px; }
#login form { width: 100%; max-width: 380px; margin: auto; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 30px; padding: 28px 22px; box-shadow: var(--shadow); }
#login h2 { margin: 0; font-family: var(--font-display); text-align: center; font-size: 1.6rem; letter-spacing: -.01em; }
#login h2::before { content: ""; display: block; width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 19px; background: linear-gradient(135deg, #0B5E4F, #14A383); box-shadow: var(--shadow-lg);
  -webkit-mask: none; }
#login input[type=text], #login input[type=password], #login input[type=number] { min-height: 52px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); padding: 0 16px; font-size: 1rem; font-family: inherit; }
#login input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
#login .seg { display: flex; gap: 4px; padding: 4px; background: var(--bg2); border-radius: 16px; }
#login .seg button { flex: 1; min-height: 42px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; }
#login .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
#login label.chk { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--muted); }
#login .sub { margin: 0; text-align: center; color: var(--muted); font-size: 0.9rem; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 50; pointer-events: none; max-width: min(92vw, 420px); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 16px; font-size: 0.92rem; font-weight: 500; text-align: center; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); }
@media (prefers-reduced-motion: no-preference) { #toast { animation: pop .2s ease-out; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 11c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M12 14c0-2.4-1.7-4-4.2-4 0 2.4 1.7 4 4.2 4z"/><path d="M6 21h12"/></svg></div>
    <div>
      <h1>കുടുംബ പുസ്തകം</h1>
      <div id="count" class="count"></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button type="button" data-tab="tree"></button>
    <button type="button" data-tab="people"></button>
    <button type="button" data-tab="more"></button>
  </div>
</nav>
<button id="fab" class="fab" type="button" aria-label="Add person">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span id="fabLabel"></span>
</button>

<div id="sheet" class="sheet" hidden><div id="sheetCard" class="sheet-card" role="dialog" aria-modal="true"></div></div>

<div id="lock" class="lock" hidden>
  <form id="lockForm" autocomplete="off">
    <h2>കുടുംബ പുസ്തകം</h2>
    <p style="margin:0;color:var(--muted)">PIN നൽകുക</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" aria-label="PIN">
    <p id="lockErr" class="form-err" role="alert"></p>
    <button class="btn primary" type="submit">തുറക്കുക</button>
  </form>
</div>

<input id="importFile" type="file" accept=".json,application/json" hidden>
<div id="login" hidden>
  <form id="loginForm" autocomplete="off">
    <h2>കുടുംബ പുസ്തകം</h2>
    <p class="sub" id="loginSub">കുടുംബ കോഡും പേരും നൽകുക</p>
    <div class="seg"><button type="button" id="segM" aria-pressed="true">കുടുംബാംഗം</button><button type="button" id="segA" aria-pressed="false">അഡ്മിൻ</button></div>
    <div id="memberBox" style="display:flex;flex-direction:column;gap:10px">
      <input type="password" id="lgCode" placeholder="കുടുംബ കോഡ്" aria-label="Family code" autocomplete="off">
      <input type="text" id="lgName" placeholder="നിങ്ങളുടെ പേര്" aria-label="Name" autocomplete="off">
      <input type="password" id="lgPin" inputmode="numeric" maxlength="6" placeholder="PIN (4-6 അക്കം)" aria-label="PIN" autocomplete="off">
      <label class="chk"><input type="checkbox" id="lgNew"> ആദ്യമായി വരുന്നു (പുതിയ PIN വെക്കുക)</label>
    </div>
    <div id="adminBox" hidden><input type="password" id="lgPass" placeholder="അഡ്മിൻ പാസ്‌വേഡ്" aria-label="Admin password" autocomplete="off" style="width:100%;box-sizing:border-box"></div>
    <p id="loginErr" class="form-err" role="alert"></p>
    <button class="btn primary" type="submit" id="loginBtn">കയറുക</button>
  </form>
</div>
<div id="toast" hidden role="status"></div>

<script>
(function () {
  'use strict';

  var KEY = 'familyBook.v1';
  var PINKEY = 'familyBook.pin';
  var state = { people: [] };
  var net = { remote: true, admin: false, ready: false, token: '', name: '', written: {}, q: Promise.resolve(), members: [] };
  var ui = { tab: 'tree', q: '', blood: '', collapsed: {}, reveal: {}, locked: false, hiddenAt: 0 };
  var BLOODS = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];

  /* ---------- tiny helpers ---------- */
  function $(s) { return document.querySelector(s); }
  function uid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* ignore */ }
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    if (c.nodeType) { el.appendChild(c); return; }
    el.appendChild(document.createTextNode(String(c)));
  }
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (k === 'checked') el.checked = true;
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function av(name, big) {
    var n = String(name || '?').trim(), hh = 0, i;
    for (i = 0; i < n.length; i++) hh = (hh * 31 + n.charCodeAt(i)) % 360;
    var el = h('span', { class: 'av' + (big ? ' lg' : ''), text: Array.from(n)[0] || '?' });
    el.setAttribute('style', '--h:' + hh);
    el.setAttribute('aria-hidden', 'true');
    return el;
  }
  function T(ml, en) { return h('span', { class: 'bi' }, h('b', { text: ml }), en ? h('small', { text: en }) : null); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------- data ---------- */
  function clean(x) {
    var s = function (v) { return typeof v === 'string' ? v : (v === null || v === undefined ? '' : String(v)); };
    return {
      id: s(x.id) || uid(),
      _o: s(x._o),
      _on: s(x._on),
      _mine: x._mine !== false,
      aadhaarLast4: s(x.aadhaarLast4).replace(/\D/g, '').slice(-4),
      name: s(x.name).trim(),
      gender: ['M', 'F', 'O'].indexOf(x.gender) >= 0 ? x.gender : '',
      dob: /^\d{4}-\d{2}-\d{2}$/.test(s(x.dob)) ? x.dob : '',
      dobYear: /^\d{4}$/.test(s(x.dobYear)) ? s(x.dobYear) : '',
      dead: !!x.dead,
      dod: /^\d{4}-\d{2}-\d{2}$/.test(s(x.dod)) ? x.dod : '',
      phone: s(x.phone).trim(),
      aadhaar: s(x.aadhaar).replace(/\D/g, '').slice(0, 12),
      blood: BLOODS.indexOf(x.blood) >= 0 ? x.blood : '',
      fatherId: s(x.fatherId),
      motherId: s(x.motherId),
      spouseIds: Array.isArray(x.spouseIds) ? x.spouseIds.filter(function (i) { return typeof i === 'string' && i; }) : [],
      notes: s(x.notes),
      createdAt: Number(x.createdAt) || Date.now(),
      updatedAt: Number(x.updatedAt) || Date.now()
    };
  }
  function load() {
    try {
      var raw = lsGet(KEY, '');
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.people)) {
        state.people = d.people.filter(function (x) { return x && x.name; }).map(clean);
      }
    } catch (e) { state.people = []; }
  }
  function save() {
    if (!net.ready) { toast('ഇപ്പോൾ സേവ് ചെയ്യാൻ കഴിയില്ല. കുറച്ച് കഴിഞ്ഞ് ശ്രമിക്കുക.'); return false; }
    var changed = [], now = {}, del = [];
    state.people.forEach(function (p) {
      if (!mayEdit(p)) return;
      var sp = strip(p), j = JSON.stringify(sp);
      now[p.id] = 1;
      if (net.written[p.id] !== j) { changed.push(sp); net.written[p.id] = j; }
    });
    if (net.admin) Object.keys(net.written).forEach(function (id) { if (!now[id] && !P(id)) { del.push(id); delete net.written[id]; } });
    if (!changed.length && !del.length) return true;
    net.q = net.q.then(function () {
      var jobs = [];
      if (changed.length) jobs.push(api('save', { people: changed }));
      if (del.length) jobs.push(api('delete', { ids: del }));
      return Promise.all(jobs);
    }).catch(function (e) {
      if (e && e.code === 401) return;
      toast((e && e.message) || 'സേവ് ആയില്ല. ഇന്റർനെറ്റ് നോക്കുക.');
      loadRemote();
    });
    return true;
  }
  function mayEdit(p) { return net.admin || p._mine !== false; }
  function strip(p) {
    var o = {};
    Object.keys(p).forEach(function (k) { if (k.charAt(0) !== '_' && k !== 'aadhaarLast4') o[k] = p[k]; });
    return o;
  }
  /* ---------- server ---------- */
  var TOKKEY = 'familyBook.token';
  function api(action, data) {
    var body = Object.assign({ action: action, token: net.token }, data || {});
    return fetch('/api/fb', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.ok) return j;
        var err = new Error(j.message || 'തകരാറ്'); err.code = r.status; err.kind = j.error;
        if (r.status === 401 && j.error === 'auth') { net.token = ''; lsSet(TOKKEY, ''); showLogin(''); }
        throw err;
      });
    });
  }
  function applyRemote(list) {
    var all = [], seen = {};
    net.written = {};
    list.forEach(function (x) {
      if (!x || !x.name) return;
      var c = clean(x);
      if (seen[c.id]) return; seen[c.id] = 1;
      if (mayEdit(c)) net.written[c.id] = JSON.stringify(strip(c));
      all.push(c);
    });
    var byId = {};
    all.forEach(function (p) { byId[p.id] = p; });
    all.forEach(function (p) { p.spouseIds.forEach(function (sid) { var o = byId[sid]; if (o && o.spouseIds.indexOf(p.id) < 0) o.spouseIds.push(p.id); }); });
    state.people = all;
    net.ready = true;
  }
  function loadRemote(quiet) {
    return api('list').then(function (j) {
      net.admin = j.role === 'admin'; net.name = j.name || '';
      applyRemote(j.people || []);
      if (!ui.locked && (!quiet || $('#sheet').hidden)) render();
    }).catch(function (e) {
      if (!quiet) toast((e && e.message) || 'ഡാറ്റ എടുക്കാൻ കഴിഞ്ഞില്ല. ഇന്റർനെറ്റ് നോക്കുക.');
    });
  }
  function showLogin(msg) {
    $('#login').hidden = false; $('#app').hidden = true; $('#tabs').hidden = true; $('#fab').hidden = true;
    $('#loginErr').textContent = msg || '';
  }
  function enterApp() {
    $('#login').hidden = true; $('#app').hidden = false; $('#tabs').hidden = false;
    net.ready = false;
    return loadRemote().then(function () { if (pinSet() && canHash) lockNow(); });
  }
  var asAdmin = false;
  function setSeg(a) {
    asAdmin = a;
    $('#segM').setAttribute('aria-pressed', a ? 'false' : 'true'); $('#segA').setAttribute('aria-pressed', a ? 'true' : 'false');
    $('#memberBox').hidden = a; $('#adminBox').hidden = !a;
    $('#loginErr').textContent = '';
  }
  $('#segM').addEventListener('click', function () { setSeg(false); });
  $('#segA').addEventListener('click', function () { setSeg(true); });
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
    var data = asAdmin ? { role: 'admin', password: $('#lgPass').value }
      : { role: 'member', code: $('#lgCode').value.trim(), name: $('#lgName').value, pin: $('#lgPin').value.trim(), create: $('#lgNew').checked };
    net.token = '';
    api('login', data).then(function (j) {
      net.token = j.token; lsSet(TOKKEY, j.token);
      $('#lgPin').value = ''; $('#lgPass').value = '';
      return enterApp();
    }).catch(function (err) { $('#loginErr').textContent = (err && err.message) || 'ലോഗിൻ പരാജയപ്പെട്ടു'; }).then(function () { btn.disabled = false; });
  });
  function logout() { net.token = ''; lsSet(TOKKEY, ''); state.people = []; net.ready = false; closeSheet(); showLogin(''); }
  function initRemote() {
    net.token = lsGet(TOKKEY, '');
    if (!net.token) { showLogin(''); return; }
    enterApp();
  }
  setInterval(function () { if (net.token && net.ready && !document.hidden && !ui.locked) loadRemote(true); }, 45000);
  function P(id) {
    if (!id) return null;
    for (var i = 0; i < state.people.length; i++) if (state.people[i].id === id) return state.people[i];
    return null;
  }
  function byName(a, b) { return (a.name || '').localeCompare(b.name || ''); }
  function sortKey(p) { return p.dob ? p.dob : (p.dobYear ? p.dobYear + '-00-00' : '9999'); }
  function byBirth(a, b) { var x = sortKey(a), y = sortKey(b); return x < y ? -1 : (x > y ? 1 : byName(a, b)); }
  function descendants(id) {
    var out = {};
    (function walk(x) {
      state.people.forEach(function (c) {
        if ((c.fatherId === x || c.motherId === x) && !out[c.id]) { out[c.id] = 1; walk(c.id); }
      });
    })(id);
    return out;
  }
  function addSpouse(a, bId) { if (a.spouseIds.indexOf(bId) < 0) a.spouseIds.push(bId); }
  function linkParents(child) {
    var fa = P(child.fatherId), mo = P(child.motherId);
    if (fa && mo) { addSpouse(fa, mo.id); addSpouse(mo, fa.id); }
  }

  /* ---------- dates, ages ---------- */
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
  }
  function birthYear(p) { return p.dob ? +p.dob.slice(0, 4) : (p.dobYear ? +p.dobYear : null); }
  function deathYear(p) { return p.dod ? +p.dod.slice(0, 4) : null; }
  function ageOf(p) {
    var by = birthYear(p);
    if (!by) return null;
    if (p.dead && !p.dod) return null;
    var end = p.dead ? new Date(p.dod + 'T00:00:00') : new Date();
    var a = end.getFullYear() - by;
    if (p.dob) {
      var b = new Date(p.dob + 'T00:00:00');
      var md = (end.getMonth() - b.getMonth()) || (end.getDate() - b.getDate());
      if (md < 0) a--;
    }
    return a < 0 ? null : a;
  }
  function metaLine(p) {
    if (p.dead) {
      var by = birthYear(p), dy = deathYear(p);
      return (by || '?') + ' – ' + (dy || '?');
    }
    var a = ageOf(p);
    return a === null ? '' : a + ' വയസ്സ്';
  }
  function fmtAadhaar(d) { return String(d || '').replace(/\D/g, '').replace(/(\d{4})(?=\d)/g, '$1 '); }
  function maskAadhaar(d) { d = String(d || ''); return d.length === 12 ? '•••• •••• ' + d.slice(8) : d; }

  function upcomingBirthdays() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var out = [];
    state.people.forEach(function (p) {
      if (p.dead || !p.dob) return;
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p.dob);
      if (!m) return;
      var mo = +m[2] - 1, d = +m[3];
      var nx = new Date(today.getFullYear(), mo, d);
      if (nx < today) nx = new Date(today.getFullYear() + 1, mo, d);
      var days = Math.round((nx - today) / 86400000);
      if (days <= 45) out.push({ p: p, days: days, turning: nx.getFullYear() - (+m[1]) });
    });
    out.sort(function (a, b) { return a.days - b.days; });
    return out.slice(0, 5);
  }

  /* ---------- sheet ---------- */
  function showSheet(nodes) {
    var card = $('#sheetCard');
    card.textContent = '';
    add(card, nodes);
    $('#sheet').hidden = false;
    card.scrollTop = 0;
  }
  function closeSheet() { $('#sheet').hidden = true; $('#sheetCard').textContent = ''; ui.reveal = {}; }
  function askSheet(msg, yesLabel, onYes, onNo) {
    showSheet([
      h('div', { class: 'sheet-head' }, h('h2', { text: 'ഉറപ്പാണോ?' }), closeBtn()),
      h('p', { text: msg }),
      h('div', { class: 'form-bar' },
        h('button', { class: 'btn danger', type: 'button', onclick: onYes }, yesLabel),
        h('button', { class: 'btn', type: 'button', onclick: onNo || closeSheet }, T('വേണ്ട', 'No')))
    ]);
  }
  function closeBtn() {
    return h('button', { class: 'x', type: 'button', 'aria-label': 'Close', onclick: closeSheet },
      h('span', { 'aria-hidden': 'true', text: '✕' }));
  }

  function copyText(t, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast(label + ' കോപ്പി ചെയ്തു'); }, function () { toast('ഇവിടെ കോപ്പി അനുവദനീയമല്ല'); });
    } else { toast('ഇവിടെ കോപ്പി അനുവദനീയമല്ല'); }
  }

  /* ---------- detail ---------- */
  function relLinks(list) {
    return list.map(function (x) { return h('button', { class: 'link', type: 'button', onclick: function () { openDetail(x.id); } }, x.name); });
  }
  function rel(labelNode, list) {
    if (!list.length) return null;
    return h('div', { class: 'rel' }, h('span', { class: 'k' }, labelNode), h('div', { class: 'vs' }, relLinks(list)));
  }
  function fact(labelNode, valueNodes) {
    return h('div', { class: 'fact' }, h('span', { class: 'k' }, labelNode), h('span', { class: 'v' }, valueNodes));
  }

  function openDetail(id) {
    var p = P(id);
    if (!p) { closeSheet(); return; }
    var father = P(p.fatherId), mother = P(p.motherId);
    var spouses = p.spouseIds.map(P).filter(Boolean);
    var children = state.people.filter(function (x) { return x.fatherId === p.id || x.motherId === p.id; }).sort(byBirth);
    var sibs = state.people.filter(function (x) {
      return x.id !== p.id && ((p.fatherId && x.fatherId === p.fatherId) || (p.motherId && x.motherId === p.motherId));
    }).sort(byBirth);

    var life = [];
    if (p.dob) life.push(fmtDate(p.dob)); else if (p.dobYear) life.push(p.dobYear);
    if (p.dead) life.push('മരണം ' + (p.dod ? fmtDate(p.dod) : '(തീയതി അറിയില്ല)'));
    var ml = metaLine(p);
    if (ml && !p.dead) life.push(ml);

    var facts = [];
    if (p.phone) {
      var tel = p.phone.replace(/[^\d+]/g, '');
      facts.push(fact(T('ഫോൺ', 'Phone'), [
        h('span', { text: p.phone }),
        h('a', { class: 'a-link', href: 'tel:' + tel }, T('വിളിക്കുക', 'Call')),
        h('button', { class: 'btn small', type: 'button', onclick: function () { copyText(p.phone, 'നമ്പർ'); } }, T('കോപ്പി', 'Copy'))
      ]));
    }
    if (!p.aadhaar && p.aadhaarLast4) {
      facts.push(fact(T('ആധാർ', 'Aadhaar'), [h('span', { text: '•••• •••• ' + p.aadhaarLast4 })]));
    }
    if (p.aadhaar) {
      var shown = !!ui.reveal[p.id];
      facts.push(fact(T('ആധാർ', 'Aadhaar'), [
        h('span', { text: shown ? fmtAadhaar(p.aadhaar) : maskAadhaar(p.aadhaar) }),
        h('button', { class: 'btn small', type: 'button', onclick: function () { ui.reveal[p.id] = !shown; openDetail(p.id); } }, shown ? T('മറയ്ക്കുക', 'Hide') : T('കാണിക്കുക', 'Show')),
        shown ? h('button', { class: 'btn small', type: 'button', onclick: function () { copyText(p.aadhaar, 'ആധാർ'); } }, T('കോപ്പി', 'Copy')) : null
      ]));
    }
    if (net.admin && p._on && p._o !== 'admin') facts.push(fact(T('ചേർത്തത്', 'Added by'), [h('span', { text: p._on })]));
    if (p.blood) facts.push(fact(T('രക്തഗ്രൂപ്പ്', 'Blood group'), [h('span', { class: 'badge', text: p.blood })]));
    if (p.gender) facts.push(fact(T('ലിംഗം', 'Gender'), [h('span', { text: p.gender === 'M' ? 'പുരുഷൻ' : (p.gender === 'F' ? 'സ്ത്രീ' : 'മറ്റുള്ളവ') })]));
    if (p.notes) facts.push(fact(T('കുറിപ്പ്', 'Notes'), [h('span', { text: p.notes })]));

    var rels = [
      rel(T('അച്ഛൻ', 'Father'), father ? [father] : []),
      rel(T('അമ്മ', 'Mother'), mother ? [mother] : []),
      rel(T('ജീവിതപങ്കാളി', 'Spouse'), spouses),
      rel(T('മക്കൾ', 'Children'), children),
      rel(T('സഹോദരങ്ങൾ', 'Siblings'), sibs)
    ].filter(Boolean);

    var actions = [
      mayEdit(p) ? h('button', { class: 'btn primary', type: 'button', onclick: function () { openForm({ id: p.id }); } }, T('എഡിറ്റ്', 'Edit')) : null,
      h('button', { class: 'btn', type: 'button', onclick: function () { openForm({ prefill: childPrefill(p) }); } }, T('കുട്ടിയെ ചേർക്കുക', 'Add child')),
      h('button', { class: 'btn', type: 'button', onclick: function () { openForm({ prefill: { spouseIds: [p.id], gender: p.gender === 'M' ? 'F' : (p.gender === 'F' ? 'M' : '') } }); } }, T('പങ്കാളിയെ ചേർക്കുക', 'Add spouse'))
    ];
    if (!father && mayEdit(p)) actions.push(h('button', { class: 'btn', type: 'button', onclick: function () { openForm({ prefill: { gender: 'M' }, childOf: { id: p.id, role: 'father' } }); } }, T('അച്ഛനെ ചേർക്കുക', 'Add father')));
    if (!mother && mayEdit(p)) actions.push(h('button', { class: 'btn', type: 'button', onclick: function () { openForm({ prefill: { gender: 'F' }, childOf: { id: p.id, role: 'mother' } }); } }, T('അമ്മയെ ചേർക്കുക', 'Add mother')));

    showSheet([
      h('div', { class: 'sheet-head' },
        h('div', { class: 'who' }, av(p.name, true), h('div', null, h('h2', { text: p.name }), life.length ? h('p', { class: 'life', text: life.join(' · ') }) : null)),
        closeBtn()),
      rels.length ? h('div', { class: 'card' }, rels) : null,
      facts.length ? h('div', { class: 'card facts' }, facts) : null,
      h('div', { class: 'actions' }, actions)
    ]);
  }

  function childPrefill(par) {
    var sp = P(par.spouseIds[0]);
    var f = {};
    if (par.gender === 'F') { f.motherId = par.id; f.fatherId = sp ? sp.id : ''; }

  /* ---------- tree view ---------- */
  function personCard(p) {
    return h('button', { class: 'pcard' + (p.dead ? ' gone' : ''), type: 'button', onclick: function () { openDetail(p.id); } },

  function renderUnit(p, visited) {
    var members = [p];
    visited[p.id] = 1;
    p.spouseIds.forEach(function (sid) {
      var s = P(sid);
      if (s && !visited[s.id]) { visited[s.id] = 1; members.push(s); }
    });
    var kids = state.people.filter(function (x) {
      return !visited[x.id] && members.some(function (m) { return x.fatherId === m.id || x.motherId === m.id; });
    }).sort(byBirth);

    var node = h('div', { class: 'node' });
    var row = h('div', { class: 'unit' });
    members.forEach(function (m, i) {
      if (i) row.appendChild(h('span', { class: 'amp', 'aria-hidden': 'true', text: '+' }));
      row.appendChild(personCard(m));
    });
    node.appendChild(row);
    if (kids.length) {
      var closed = !!ui.collapsed[p.id];
      node.appendChild(h('button', {
        class: 'tog', type: 'button', 'aria-expanded': closed ? 'false' : 'true',
        onclick: function () { ui.collapsed[p.id] = !closed; render(); }
      }, (closed ? '▸ ' : '▾ ') + kids.length + ' മക്കൾ'));
      if (!closed) {
        var wrap = h('div', { class: 'kids' });
        kids.forEach(function (k) { if (!visited[k.id]) wrap.appendChild(renderUnit(k, visited)); });
        node.appendChild(wrap);
      }
    }
    return node;
  }

  function relationLine(p) {

  /* ---------- backup, restore, export ---------- */
  function download(name, mime, text) {
    if (window.claude && claude.use) {
      claude.use('downloads').then(function (dl) {
        if (!dl) return plainDownload(name, mime, text);
        return dl.save({ filename: name, data: text }).then(function () { toast('ഫയൽ സേവ് ചെയ്തു'); }, function (e) { if (!e || e.code !== 'declined') toast('ഡൗൺലോഡ് നടന്നില്ല'); });
      }, function () { plainDownload(name, mime, text); });
      return;
    }
    plainDownload(name, mime, text);
  }
  function plainDownload(name, mime, text) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

    download('family-book-' + stamp() + '.json', 'application/json', JSON.stringify({ v: 1, exportedAt: new Date().toISOString(), people: state.people }, null, 2));
    toast('ബാക്കപ്പ് ഫയൽ ഡൗൺലോഡ് ആയി');
  }

    $('#count').textContent = (n ? n + ' അംഗങ്ങൾ' : '') + (net.remote ? (n ? ' · ' : '') + (net.admin ? 'അഡ്മിൻ' : 'അംഗം') : '');
    $('#fab').hidden = ui.tab === 'more' || ui.locked || !n;
    $('#fabLabel').textContent = '';
    $('#fabLabel').appendChild(T('അംഗത്തെ ചേർക്കുക', 'Add'));
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) {
    b.addEventListener('click', function () { ui.tab = b.getAttribute('data-tab'); render(); window.scrollTo(0, 0); });
  });
  $('#fab').addEventListener('click', function () { openForm({}); });
  $('#sheet').addEventListener('click', function (e) { if (e.target === $('#sheet')) closeSheet(); });
  $('#importFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) importFile(f);
    e.target.value = '';
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

  /* ---------- start ---------- */
  initRemote();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  render();
  if (pinSet() && canHash) lockNow();
})();
</script>
